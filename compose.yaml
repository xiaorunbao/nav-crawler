name: nav-crawler

services:
  mysql:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    image: nav-mysql:8.4
    container_name: nav-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-nav_root_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nav}
      MYSQL_USER: ${MYSQL_USER:-nav_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nav_app_pwd}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --default-time-zone=+08:00
      - --skip-name-resolve
      - --max-connections=200
      - --innodb-buffer-pool-size=256M
      - --innodb-flush-log-at-trx-commit=1
      - --log-bin-trust-function-creators=1
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ./docker/data/mysql:/var/lib/mysql
      - ./docker/mysql/tools:/tools:ro
      - ./docker/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"